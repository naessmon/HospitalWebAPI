<!-- archivo -->
<div class="container">

    <h1>Citas Médicas</h1>

    <!-- Formulario -->
    <div class="card">
        <h2>Crear Cita</h2>

        <input type="text" id="paciente" placeholder="Nombre del paciente">
        <input type="text" id="doctor" placeholder="Nombre del doctor">
        <input type="date" id="fecha">
        <input type="time" id="hora">

        <button onclick="crearCita()">Guardar Cita</button>
    </div>

    <!-- Lista -->
    <div class="card">
        <h2>Lista de Citas</h2>

        <table>
            <thead>
                <tr>
                    <th>Paciente</th>
                    <th>Doctor</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                </tr>
            </thead>
            <tbody id="tablaCitas"></tbody>
        </table>
    </div>

</div>
